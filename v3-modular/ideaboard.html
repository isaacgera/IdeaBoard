<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Idea Board</title>

<!-- Modular CSS -->
<link rel="stylesheet" href="styles/variables.css">
<link rel="stylesheet" href="styles/layout.css">
<link rel="stylesheet" href="styles/components.css">
<link rel="stylesheet" href="styles/dashboard.css">
<link rel="stylesheet" href="styles/kanban.css">
<link rel="stylesheet" href="styles/list.css">
<link rel="stylesheet" href="styles/tour.css">
<link rel="stylesheet" href="styles/responsive.css">
</head>
<body>
<div class="app">
  <header>
    <div class="header-left">
      <div class="header-brand">
        <div class="brand-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 1 7 7c0 2.4-1.2 4.5-3 5.7V17a1 1 0 0 1-1 1h-6a1 1 0 0 1-1-1v-2.3C6.2 13.5 5 11.4 5 9a7 7 0 0 1 7-7z"/></svg>
        </div>
        <div>
          <h1>Idea Board <span class="team-name">Architecture Middleware Integration Team</span></h1>
          <span class="subtitle">Team Innovation Tracker <span class="last-updated" id="last-updated"></span></span>
        </div>
      </div>
    </div>
    <div class="user-bar">
      <button class="btn btn-sm" onclick="IB.startTour()" title="Take a guided tour">Tour</button>
      <a class="btn btn-sm" href="../userguide.html" target="_blank" title="User Guide">Guide</a>
      <button class="theme-btn" id="theme-toggle" onclick="IB.toggleTheme()" title="Toggle dark/light mode"></button>
      <span class="online-count" id="online-count" onclick="IB.showOnlineUsers()" style="display:none">1 online</span>
      <span class="user-name" id="user-display"></span>
      <div class="user-avatar" id="user-avatar"></div>
      <button class="btn btn-sm" id="btn-switch-user" onclick="IB.changeUser()">Switch</button>
    </div>
  </header>

  <div id="dashboard-container"></div>

  <div class="toolbar">
    <button class="btn btn-primary" onclick="IB.showAddIdea()">+ New Idea</button>
    <input type="text" class="search-box" id="search-input" placeholder="Search ideas..." oninput="IB.filterIdeas()">
    <select id="filter-category" onchange="IB.filterIdeas()"><option value="">All Categories</option></select>
    <select id="filter-priority" onchange="IB.filterIdeas()">
      <option value="">All Priorities</option>
      <option value="High">High</option>
      <option value="Medium">Medium</option>
      <option value="Low">Low</option>
    </select>
    <div class="view-toggle">
      <button id="view-kanban" class="active" onclick="IB.setView('kanban')">Board</button>
      <button id="view-list" onclick="IB.setView('list')">List</button>
    </div>
    <button class="btn btn-sm" id="btn-manage-data" onclick="IB.showManageData()" style="display:none">Manage Data</button>
    <input type="file" id="import-file" accept=".json" style="display:none" onchange="IB.handleImport(this)">
  </div>

  <div id="board-content"></div>
</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal" id="modal-content"></div>
</div>
<div class="toast" id="toast"></div>

<!-- Intro Tour Overlay -->
<div class="tour-overlay" id="tour-overlay">
  <div class="tour-spotlight" id="tour-spotlight"></div>
  <div class="tour-tooltip" id="tour-tooltip">
    <div class="tour-tooltip-content" id="tour-content"></div>
    <div class="tour-tooltip-footer">
      <span class="tour-step-indicator" id="tour-indicator"></span>
      <div class="tour-nav">
        <button class="btn btn-sm" id="tour-prev" onclick="IB.tourPrev()">Back</button>
        <button class="btn btn-sm btn-primary" id="tour-next" onclick="IB.tourNext()">Next</button>
        <button class="btn btn-sm" onclick="IB.tourEnd()">Skip Tour</button>
      </div>
    </div>
  </div>
</div>

<!-- Firebase SDK (loaded before app module) -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<!-- App Entry Point (ES Module) -->
<script type="module" src="src/app.js"></script>
</body>
</html>
