image: alpine:latest

pages:
  stage: deploy
  tags:
    - mobius_shared_runner_cloud
  script:
    - mkdir public
    - cp prototypes/*.html prototypes/*.js prototypes/*.json prototypes/*.png public/
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
